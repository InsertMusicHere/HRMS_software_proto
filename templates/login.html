
{% block content %}

<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='../static/attendance.css') }}">
        <link rel="stylesheet" href="../static/attendance.css">
        <link rel="stylesheet" href="../static/nav_button.css">
        <link rel="stylesheet" href="../static/download_button.css">
        <link rel="stylesheet" href="../static/cop_table.css">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
</head>
<body>
    <div class="container" style="margin-top: 90px;">
        <div class="card card-body">
            <h3>Employee Login</h3>
            <form method="POST" action="{{ url_for('login') }}">
                <label for="username">Username:</label>
                <input name="username" class="form-control" id="inputFullName" aria-describedby="emailHelp" placeholder="Employee Id" type="text" required>
                <small id="username" class="form-text text-muted">Please enter your Employee ID</small>
                <br>
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
                <small id="password" class="form-text text-muted">We'll never share your email with anyone else.</small>
                <br>
                <button type="submit" value="Login" class="btn btn-primary" style="font-weight: bold;font-size: large;background-color: #5c95ff;">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>

{% endblock %}
